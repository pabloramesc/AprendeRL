[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aprenderl"
version = "0.1.0"
description = "Small, educational reinforcement-learning implementations in PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pablo Ramirez" }]
dependencies = [
    "gymnasium[classic-control]>=0.29,<2",
    "ipywidgets>=8",
    "jupyterlab>=4",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "torch>=2.1",
    "tqdm>=4.66",
    "typing-extensions>=4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aprenderl"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["smoke: slower end-to-end learning tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]
